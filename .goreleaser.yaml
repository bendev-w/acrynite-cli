version: 2

project_name: acrynite

before:
  hooks:
    - go mod tidy

builds:
  - id: acrynite
    main: .
    binary: acrynite
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X acrynite-cli/cmd.Version={{.Version}}
      - -X acrynite-cli/cmd.GitCommit={{.ShortCommit}}
      - -X acrynite-cli/cmd.BuildDate={{.Date}}

archives:
  - id: default
    name_template: "acrynite_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
