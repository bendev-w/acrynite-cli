# Acrynite Test Lab — four services on one bridge network.
#
# S3 is provided by LocalStack (http://localstack:4566), a faithful, anonymously
# pullable S3 emulator. (MinIO's images now require a Docker Hub / quay login, which
# breaks the "only Docker installed, no account" promise, so the lab uses LocalStack.)
# Override S3_IMAGE in .env to use a different backend.
#
# The key trick: LAB_WORK (an absolute HOST path, $(pwd)/work, written into .env by
# lab.sh) is bind-mounted at that SAME absolute path inside both `postgres` and
# `toolbox`. Acrynite's `wal enable` writes an archive_command containing the binary
# path (os.Executable) and working directory (os.Getwd). Because the path is identical
# in both containers, PostgreSQL (uid 999) can execute the very same binary the tester
# ran, and the Docker bind mounts `restore run` creates under TMPDIR resolve on the host.
#
# RULE: never pass archive_mode / archive_command / archive_timeout with -c on the
# postgres command line. Command-line settings override ALTER SYSTEM, which would make
# `acrynite wal enable` silently ineffective. PostgreSQL 17 defaults are already enough.
name: acrynite-lab

services:
  localstack:
    image: ${S3_IMAGE:-localstack/localstack:4}
    environment:
      SERVICES: s3
      DEBUG: "0"
      # The bucket name, read by the init hook below.
      BUCKET: ${S3_BUCKET:-acrynite-lab}
    volumes:
      # Creates the bucket automatically once LocalStack is ready.
      - ./localstack/init-bucket.sh:/etc/localstack/init/ready.d/init-bucket.sh:ro
    ports:
      # Published for optional host inspection; the API is reached in-network at http://localstack:4566.
      - "127.0.0.1:${S3_HOST_PORT:-4566}:4566"
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by the initdb .sh scripts to set role passwords.
      ACRYNITE_BACKUP_PASSWORD: ${ACRYNITE_BACKUP_PASSWORD}
      LAB_WRITER_PASSWORD: ${LAB_WRITER_PASSWORD}
      # archive_command inherits these: the S3 (LocalStack) credentials for `acrynite wal push`.
      # LocalStack accepts any non-empty credentials; the SDK just needs them present.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # gosu preserves the environment, so the postmaster (and thus archive_command) sees this HOME.
      # Acrynite reads its catalog + storage profile from $HOME/.acrynite-cli, which the toolbox wrote
      # into the shared folder. Without this, `wal push` run by PostgreSQL could not find the config.
      HOME: ${LAB_WORK}/home
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${LAB_WORK}:${LAB_WORK}
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  writer:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: lab_writer
      PGDATABASE: lab_app
      PGPASSWORD: ${LAB_WRITER_PASSWORD}
      PGTZ: UTC
      WRITE_INTERVAL: ${WRITE_INTERVAL:-3}
    entrypoint: ["/bin/sh", "/writer.sh"]
    volumes:
      - ./writer/writer.sh:/writer.sh:ro
    networks: [lab]
    restart: unless-stopped

  toolbox:
    build:
      context: ./toolbox
    working_dir: ${LAB_WORK}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      LAB_WORK: ${LAB_WORK}
      # restore run uses os.MkdirTemp("", ...): TMPDIR must be inside LAB_WORK so the recovery
      # folder exists on the host for the bind mount into the recovery container.
      TMPDIR: ${LAB_WORK}/tmp
      HOME: ${LAB_WORK}/home
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      ACRYNITE_VERSION: ${ACRYNITE_VERSION:-latest}
      ACRYNITE_BINARY: ${ACRYNITE_BINARY:-}
      # Exported so the tester can type: --password "$ACRYNITE_BACKUP_PASSWORD"
      ACRYNITE_BACKUP_PASSWORD: ${ACRYNITE_BACKUP_PASSWORD}
    volumes:
      - ${LAB_WORK}:${LAB_WORK}
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [lab]
    command: ["sleep", "infinity"]
    restart: unless-stopped

networks:
  lab:
    driver: bridge

volumes:
  pgdata:
